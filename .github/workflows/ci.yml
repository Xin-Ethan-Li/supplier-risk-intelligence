name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm --filter @srm/api test
      - run: pnpm build

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/risk-engine
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/risk-engine/pyproject.toml
      - run: python -m pip install --upgrade "pip>=26.1.2"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pip_audit
      - run: python -m ruff check --config services/risk-engine/pyproject.toml services/risk-engine pipelines
        working-directory: .
      - run: python -m pytest services/risk-engine/tests pipelines/tests
        working-directory: .
      - run: python -m pipelines.verify_artifacts
        working-directory: .
      - run: python -m pipelines.evaluate_retrieval
        working-directory: .
      - run: python -m pipelines.verify_retrieval_artifacts
        working-directory: .
      - run: python -m pipelines.security_audit
        working-directory: .

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker compose config --quiet
      - run: docker build --file deploy/Dockerfile.free-backend --tag srm-free-backend:ci .
