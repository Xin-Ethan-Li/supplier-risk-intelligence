services:
  risk-engine:
    build:
      context: .
      dockerfile: services/risk-engine/Dockerfile
    ports:
      - "8000:8000"
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 3000
      RISK_ENGINE_URL: http://risk-engine:8000
      WEB_ORIGINS: http://localhost:8080
      RISK_ENGINE_TIMEOUT_MS: 2000
      API_REQUEST_TIMEOUT_MS: 3000
      API_BODY_LIMIT_BYTES: 65536
      API_RATE_LIMIT_MAX: 30
      API_RATE_LIMIT_WINDOW_MS: 60000
    ports:
      - "3100:3000"
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      risk-engine:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        PUBLIC_API_BASE_URL: http://localhost:3100
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
