[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "srm-risk-engine"
version = "0.5.0"
description = "Python ML and retrieval boundary for the supplier-risk demo."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "joblib>=1.4,<2",
  "numpy>=2.2,<3",
  "pandas>=2.2,<4",
  "pydantic>=2.10,<3",
  "scikit-learn>=1.6,<2",
  "xgboost-cpu>=3.0,<4; platform_system == 'Linux'",
  "xgboost>=3.0,<4; platform_system != 'Linux'",
  "uvicorn[standard]>=0.34,<1"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "ruff>=0.11,<1"
]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
