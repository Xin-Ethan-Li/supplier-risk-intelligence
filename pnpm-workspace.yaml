packages:
  - apps/*
  - packages/*

allowBuilds:
  esbuild: true
  sharp: true

minimumReleaseAgeExclude:
  - esbuild@0.28.1
  - astro@7.0.4 || 7.0.6 || 7.0.10
  - sharp@0.35.0
  - "@fastify/static@10.1.1 || 10.1.2"
  - brace-expansion@5.0.8

overrides:
  "@fastify/static@<=10.1.0": ^10.1.1
  "@fastify/static@<=10.1.1": ^10.1.2
  astro@<7.0.6: ^7.0.6
  astro@>=2.9.0 <=7.0.9: ^7.0.10
  astro@>=3.10.0 <7.0.4: ^7.0.4
  brace-expansion@<=5.0.7: ^5.0.8
  esbuild@>=0.27.3 <0.28.1: ^0.28.1
  sharp@<0.35.0: ^0.35.0
